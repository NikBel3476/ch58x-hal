[package]
name = "ch58x-hal"
version = "0.0.2"
edition = "2021"
authors = ["Andelf <andelf@gmail.com>"]
repository = "https://github.com/ch32-rs/ch58x-hal"
documentation = "https://docs.rs/ch58x-hal"
homepage = "https://github.com/ch32-rs/ch58x-hal"
categories = ["embedded", "no-std"]
description = "HAL for the CH583/CH582/CH581 RISC-V BLE microcotrollers from WCH"
keywords = ["embedded-hal", "embassy", "ch582", "ch581", "ch583"]
readme = "README.md"
license = "MIT/Apache-2.0"

[features]
default = ["embassy", "highcode"]
highcode = ["qingke-rt/highcode"]
embassy = [
    "dep:embassy-time-queue-utils",
    "dep:embassy-time-driver",
    "dep:embassy-time",
    "dep:embassy-sync",
]
ble = []
# Features starting with `_` are for internal use only. They're not intended
# to be enabled by other crates, and are not covered by semver guarantees.
_time-driver = []

## Use any time driver
time-driver-any = ["_time-driver"]
## Use TIM1 as time driver
time-driver-tim1 = ["_time-driver"]
## Use TIM2 as time driver
time-driver-tim2 = ["_time-driver"]
## Use TIM3 as time driver
time-driver-tim3 = ["_time-driver"]
## Use TIM4 as time driver
time-driver-tim4 = ["_time-driver"]
## Use TIM5 as time driver
time-driver-tim5 = ["_time-driver"]
## Use TIM8 as time driver
time-driver-tim8 = ["_time-driver"]
## Use TIM9 as time driver
time-driver-tim9 = ["_time-driver"]
## Use TIM10 as time driver
time-driver-tim10 = ["_time-driver"]

[dependencies]
ch58x = { version = "0.3.0", features = ["ch58x", "rt"] }

critical-section = "1.1.2"
qingke = { version = "0.5.0", features = [
    "critical-section-impl",
    "unsafe-trust-wch-atomics",
] }
qingke-rt = { version = "0.5.0" }

# qingke = { version = "0.1.7", features = [
#     "critical-section-impl",
# ], path = "../qingke" }
# qingke-rt = { version = "0.1.7", features = [
#     "highcode",
# ], path = "../qingke/qingke-rt" }

fugit = "0.3.7"
nb = "1.1.0"
embedded-hal-02 = { package = "embedded-hal", version = "0.2.7", features = [
    "unproven",
] }
embedded-hal-1 = { version = "1.0.0", package = "embedded-hal" }
embedded-hal-nb = "1.0.0"
embedded-hal-async = "1.0.0"

embassy-sync = { version = "0.7.0", optional = true }
embassy-time-driver = { version = "0.2.0", features = [
    "tick-hz-32_768",
], optional = true }
embassy-time-queue-utils = { version = "0.1", optional = true }
embassy-time = { version = "0.4.0", optional = true }

[dev-dependencies]
display-interface = "0.4.1"
display-interface-spi = "0.4.1"
embedded-graphics = "0.8.1"
panic-halt = "0.2.0"
ssd1306 = "0.8.4"
embassy-futures = "0.1.1"
embassy-executor = { version = "0.7.0", features = [
    "arch-riscv32",
    "executor-thread",
] }

# embassy time driver
heapless = "0.8.0"
embedded-alloc = "0.6.0"
embedded-sdmmc = "0.9.0"

[profile.release]
# panic = "unwind"
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
